# Image Annotation Studio - Continuous Integration
# Table of contents:
# 01. Trigger on code changes or manual requests
# 02. Matrix across Chromium, Firefox and WebKit
# 03. Compile offline HTML, run unit tests, install browser fixtures
# 04. Smoke and full E2E regressions with per-browser failure reporting
# This workflow installs tools only in CI; the distributed HTML remains offline.
name: Tests and offline build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build HTML
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Browser smoke
        env:
          STUDIO_BROWSER: ${{ matrix.browser }}
        run: npm run test:smoke
      - name: Browser regression
        env:
          STUDIO_BROWSER: ${{ matrix.browser }}
        run: npm run test:e2e
